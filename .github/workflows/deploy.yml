name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: university-schedule-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.repository == 'Papaya121/UniversitySchedule'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - home-server
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify notification safety fixes are included
        run: |
          test -f deploy/sync_token.py
          grep -Fq 'await service.check_changes(notify=False)' bot/main.py
          grep -Fq 'bot-instance.lock' bot/main.py
          grep -Fq 'show_shared_groups' bot/database.py

      - name: Create test environment
        run: |
          /home/github-runner/.local/bin/uv venv --python 3.12 .ci-venv
          /home/github-runner/.local/bin/uv pip install --python .ci-venv/bin/python -r requirements.txt

      - name: Run tests
        run: .ci-venv/bin/python -m unittest discover -s tests -v

      - name: Deploy production
        run: sudo -n -u papaya /usr/local/bin/university-schedule-deploy
